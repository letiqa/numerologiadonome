<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerologia do Nome</title>
    <link rel="preload" href="{{ url_for('static', filename='Transcity-DEMO.otf') }}" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="aura-extra"></div>

    <div class="container-wrapper">
        <div class="star star-1">⋆</div>
        <div class="star star-2">✴︎</div>
        <div class="star star-3">⋆</div>
        <div class="star star-4">✴︎</div>
        <div class="star star-5">⋆</div>
        <div class="star star-6">✴︎</div>

        <div class="container">
            <h1>Descubra a numerologia do seu nome</h1>
            <p> A Numerologia do nome tem influencia sobre a personalidade, nosso modo de agir e de pensar. Calcule a
                sua!
            </p>
            <form method="POST" action="/">
                <div class="form-group">
                    <label for="nome">Digite seu nome completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <button type="submit">Calcular</button>
            </form>

            {% if numero %}
            <div class="result-card">
                <h2>Resultado para <span class="name-highlight">{{ nome }}</span></h2>
                <div class="number-container">
                    <div class="number-badge">{{ numero }}</div>
                </div>
                <div class="meaning" style="white-space: pre-line;">{{ significado }}</div>
            </div>
            {% endif %}

            <script>
                if (window.history.replaceState) {
                    window.history.replaceState(null, null, window.location.href);
                }
            </script>
        </div>
    </div>

</body>

</html>
